name: Release to NuGet

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Nuget Login
        uses: Nuget/login@v1
        id: login
        with:
          user: suedeapple

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The project builds its backoffice client with npm during pack.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/SA.Umbraco.MediaPreview/Client/package-lock.json

      # A tag such as 1.2.0 sets the package version. A manual run packs the version in the .csproj.
      - name: Pack
        run: dotnet pack src/SA.Umbraco.MediaPreview/SA.Umbraco.MediaPreview.csproj -c Release ${{ github.ref_type == 'tag' && format('/p:Version={0}', github.ref_name) || '' }} --output artifacts

        # Push the package
      - name: NuGet push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
